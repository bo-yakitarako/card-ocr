# Fallow 設定。
entry = [
  "pages/**/*.{ts,tsx,js,jsx}",
  # Void file-based routing: imported by the framework, not by app code
  "routes/**/*.{ts,tsx,js,jsx,mts,mjs}",
  "middleware/**/*.{ts,tsx,js,jsx}",
  "crons/**/*.{ts,tsx,js,jsx}",
  "queues/**/*.{ts,tsx,js,jsx}",
  "db/**/*.{ts,tsx,js,jsx}",
  "email/**/*.{ts,tsx,js,jsx}",
  "durable-objects/**/*.{ts,tsx,js,jsx}",
  "src/index.{ts,tsx,js,jsx}",
  "src/main.{ts,tsx,js,jsx}",
]
supportEntry = ["void.config.ts", "vite.config.ts", "doctor.config.ts", "env.ts"]

# Void is the framework toolchain: bundling into the worker happens at build time,
# so it correctly stays in devDependencies even though pages/middleware import it.
[[framework]]
name = "void"
enablers = ["void"]
toolingDependencies = ["void", "@void/react", "vite-plus", "vite", "react-doctor", "fallow"]

# Void handlers run on Hono; hono/* middleware is imported only once API routes need it
ignoreDependencies = ["hono"]

[duplicates]
# Hide pair-only clones; focus on widespread copy-paste
# worth refactoring. Lower to 2 to report every duplicate pair.
minOccurrences = 3

[rules]
